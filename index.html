<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important} img{max-width:100%} body{margin:0}</style>
<title>Proposta Bookbox Logística</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: duas colunas. Esquerda = catálogo de serviços em 3 grupos; direita = carrinho fixo com total. No celular o carrinho desce e uma barra de total fica fixa no rodapé. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#14213D; --muted:#586379; --line:#DCE2EA;
  --accent:#F2B705; --accent-ink:#14213D; --btn:#14213D; --btn-ink:#FFFFFF;
  --ok:#1B7A5A; --warn-bg:#FFF4CC; --warn-ink:#5C4500; --field:#F7F9FB;
  --f-head:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#161F35; --ink:#EDF0F6; --muted:#9BA7BD; --line:#2A3652;
  --accent:#F2B705; --accent-ink:#14213D; --btn:#EDF0F6; --btn-ink:#14213D;
  --ok:#4CC9A0; --warn-bg:#3A3110; --warn-ink:#F5DE8A; --field:#1C2742; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#161F35; --ink:#EDF0F6; --muted:#9BA7BD; --line:#2A3652;
  --accent:#F2B705; --accent-ink:#14213D; --btn:#EDF0F6; --btn-ink:#14213D;
  --ok:#4CC9A0; --warn-bg:#3A3110; --warn-ink:#F5DE8A; --field:#1C2742; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-block:0 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-block:28px 18px}
.brand small{display:block;font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.brand h1{font-size:30px;line-height:1.1}
.client{display:flex;gap:10px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select{font:500 14px var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:22px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mode b{font:600 14px var(--f-head)} .mode span{font-size:12.5px;color:var(--muted)}
.mode:hover{border-color:var(--ink)} .mode[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.group{margin-bottom:28px}
.group>h2{font-size:19px;margin-bottom:2px}
.group>p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin-bottom:10px}
.svc.on{border-color:var(--ink)}
.svc h3{font-size:15.5px}
.svc .d{color:var(--muted);font-size:13px;margin-top:2px}
.price{text-align:right;white-space:nowrap}
.price b{font:600 18px var(--f-head);font-variant-numeric:tabular-nums}
.price small{display:block;font-size:12px;color:var(--muted)}
.ctl{grid-column:1/-1;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.ctl label.f{flex:1 1 120px;max-width:200px}
.add{margin-left:auto;font:600 13px var(--f-body);border:0;border-radius:6px;padding:9px 16px;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.svc.on .add{background:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);margin-left:8px;vertical-align:2px}
.cart{position:sticky;top:16px;background:var(--surface);border:1px solid var(--ink);border-radius:8px;padding:18px}
.cart h2{font-size:18px;margin-bottom:4px}
.cart .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.sec{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.line em{grid-column:1;font-style:normal;color:var(--muted);font-size:12px}
.line b{font-variant-numeric:tabular-nums;font-weight:600;grid-row:1;grid-column:2}
.rm{all:unset;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:underline;grid-column:2}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
.total span{font-weight:600} .total b{font:700 28px var(--f-head);font-variant-numeric:tabular-nums}
.mini{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.mini b{color:var(--ink);font-weight:600}
.act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act button,.adm button{font:600 13px var(--f-body);border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--btn);color:var(--btn-ink)}
.act button.alt,.adm button.alt{background:transparent;color:var(--ink)}
.copybox{width:100%;margin-top:10px;font:12px/1.4 ui-monospace,monospace;min-height:120px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.terms{border-top:1px solid var(--line);padding-top:16px;margin-top:8px;color:var(--muted);font-size:13px}
.terms ul{margin:6px 0 0;padding-left:18px}
.adm{background:var(--surface);border:2px dashed var(--accent);border-radius:8px;padding:18px;margin-top:28px}
.adm h2{font-size:18px}
.adm .row{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.adm .hd{font:600 11px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid7{overflow-x:auto}
.grid7 table{border-collapse:collapse;font-size:13px;min-width:520px}
.grid7 td,.grid7 th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.grid7 input{width:84px}
.inclist{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)} .inclist b{color:var(--ink);font-weight:600}
.svc.incl{border-style:dashed}
.chk{display:flex;gap:8px;align-items:center;font:500 14px var(--f-body);color:var(--ink);cursor:pointer;max-width:none!important;flex:1 1 auto!important}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.ftable{grid-column:1/-1;overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:420px}
.ftable table{border-collapse:collapse;font-size:12px;min-width:900px;font-variant-numeric:tabular-nums}
.ftable th,.ftable td{padding:4px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ftable thead th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:center;color:var(--muted);font-weight:600}
.ftable tbody th{text-align:left;position:sticky;left:0;background:var(--surface)}
.bar{display:none}
@media (max-width:900px){
  .cols{grid-template-columns:minmax(0,1fr)} .cart{position:static}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);justify-content:space-between;align-items:center;gap:10px;
    padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .bar b{font:700 20px var(--f-head);font-variant-numeric:tabular-nums}
  .bar a{color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
  .brand h1{font-size:25px}
}
@media (prefers-reduced-motion:no-preference){.svc{transition:border-color .15s}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><small>Proposta de serviços</small><h1>Bookbox Logística</h1></div>
    <div class="client">
      <label class="f">Cliente<input type="text" id="cliente" placeholder="Nome da empresa"></label>
      <label class="f">O que você vende?
        <select id="produto"><option value="livros">Livros</option><option value="outros">Outros produtos</option></select>
      </label>
    </div>
  </header>

  <div class="banner" id="banner" hidden>Modelo de proposta com valores de exemplo. Substitua pelos preços definitivos antes de enviar ao cliente.</div>

  <div class="modes" id="modes"></div>

  <div class="cols">
    <main id="catalog"></main>
    <aside class="cart" aria-live="polite">
      <h2>Seu orçamento</h2>
      <div class="sub" id="cartSub"></div>
      <div id="cartBody"></div>
      <div class="total"><span>Estimativa mensal</span><b id="totMensal">R$ 0,00</b></div>
      <div class="mini"><span>Implantação (única)</span><b id="totUnico">R$ 0,00</b></div>
      <div class="mini"><span>Custo médio por pedido</span><b id="totPedido">—</b></div>
      <div class="act">
        <button id="copy">Copiar resumo</button>
        <button id="clear" class="alt">Limpar</button>
      </div>
      <textarea class="copybox" id="copybox" hidden readonly></textarea>
    </aside>
  </div>

  <section class="terms">
    <b>Condições</b>
    <ul id="termos"></ul>
  </section>

</div>

<div class="bar"><div><small style="opacity:.7;display:block;font-size:11px">Estimativa mensal</small><b id="barTot">R$ 0,00</b></div><a href="#cartTop" onclick="document.querySelector('.cart').scrollIntoView({behavior:'smooth'});return false">Ver orçamento</a></div>

<script>
/* ===================================================================

   - porProduto: usa um preço para Livros e outro para Outros produtos.
   - min: mínimo mensal da linha (R$). 0 = sem mínimo.

           "unico" (cobrado uma vez), "perc" (% sobre o faturamento do cliente).
   - inclusos: itens sem custo, mostrados na proposta.

/* Pacotes prontos (quais serviços entram em cada modalidade). */
const MODOS = [
  {id:"A", nome:"A. Armazenagem + gestão comercial", desc:"Seu estoque fica na Bookbox, e cuidamos da venda nos canais.",
   itens:["receb","palete","inventario","manuseio","setup","gestao","sac"]},
  {id:"B", nome:"B. Só envios", desc:"Você manda o pedido, nós separamos, embalamos e expedimos.",
   itens:["manuseio"]},
  {id:"C", nome:"C. Envios + gestão dos portais", desc:"Expedição mais gestão comercial (com rastreio) e SAC dos seus canais.",
   itens:["manuseio","setup","gestao","sac"]}
];
const GRUPOS = {
  arm:{t:"Armazenagem", d:"Quanto custa deixar seus produtos guardados conosco."},
  env:{t:"Envio dos pedidos", d:"Quanto cobramos para separar, embalar e despachar cada pedido."},
  ges:{t:"Gestão do marketplace", d:"Se quiser, cuidamos da operação comercial e do pós-venda dos seus canais."}
};
</script>
<script>
(function(){
  const ORIGINAL = JSON.parse(JSON.stringify(CONFIG));
  const LS = 'bookbox-precos-v1';
  const brl = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const pct = n => (n*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
  const $ = id => document.getElementById(id);
  const byId = id => CONFIG.servicos.find(s=>s.id===id);
  const FAIXAS = ['0 a 500','501 a 1000','1001 a 1500','1501 a 2000','2001 a 3000','3001 a 4000','4001 a 5000'];

  const state = {produto:'livros', modo:'A', items:{}, freteInt:false};
  CONFIG.servicos.forEach(s=>state.items[s.id]={on:false,qtd:s.qtd});

  function persist(){}
  function exportCfg(){ return {valoresDeExemplo:CONFIG.valoresDeExemplo,
      servicos:CONFIG.servicos.map(s=>({id:s.id, preco:s.preco, porProduto:s.porProduto, min:s.min}))}; }

  function preco(s){ return s.porProduto? s.porProduto[state.produto] : s.preco; }
  function sub(s){ const it=state.items[s.id]; const q=Number(it.qtd)||0; let v=preco(s)*q; if(s.min && (s.tipo==='volume'||s.tipo==='perc')) v=Math.max(v,s.min); return v; }
  function precoTxt(s){ if(s.tipo==='perc') return pct(s.preco); return brl(preco(s)); }

  function applyModo(id){ state.modo=id; const m=MODOS.find(x=>x.id===id);
    CONFIG.servicos.forEach(s=>{state.items[s.id].on = m? m.itens.includes(s.id) : false; if(m && state.items[s.id].on && !(Number(state.items[s.id].qtd)>0)) state.items[s.id].qtd=ORIGINAL.servicos.find(o=>o.id===s.id).qtd||1;});
    render(); }

  function renderModes(){ $('modes').innerHTML = MODOS.map(m=>`<button class="mode" data-m="${m.id}" aria-pressed="${state.modo===m.id}"><b>${m.nome}</b><span>${m.desc}</span></button>`).join('');
    $('modes').querySelectorAll('button').forEach(b=>b.onclick=()=>applyModo(b.dataset.m)); }

  const prodNome = () => state.produto==='livros'?'Livros':'Outros produtos';
  function extrasEnv(){
    let h=`<div class="svc incl"><div><h3>Incluso no envio, sem custo<span class="tag">R$ 0,00</span></h3>
      <ul class="inclist">${CONFIG.inclusos.map(x=>`<li><b>${x.nome}.</b> ${x.desc}</li>`).join('')}</ul></div></div>`;
    h+=`<div class="svc ${state.freteInt?'on':''}"><div><h3>Tabela de frete Bookbox Logística</h3>
      <div class="d">Quer enviar com o nosso frete, sem etiqueta de marketplace? Marque o interesse e libere a tabela do seu tipo de produto. O manuseio já está incluso no valor.</div></div>
      <div class="ctl"><label class="chk"><input type="checkbox" id="freteInt" ${state.freteInt?'checked':''}> Tenho interesse na tabela de frete</label></div>`;
    if(state.freteInt){
      h+=`<div class="ctl"><label class="f">Tabela para<select id="freteProd"><option value="livros" ${state.produto==='livros'?'selected':''}>Livros</option><option value="outros" ${state.produto==='outros'?'selected':''}>Outros produtos</option></select></label></div>
      <div class="ftable">${tabelaFrete()}</div>
      <div class="d" style="grid-column:1/-1">Valores em R$ por envio, até 5 kg, com manuseio e embalagem. Peso em gramas. Frete de cada pedido segue a faixa de CEP de destino.</div>`;
    }
    return h+'</div>';
  }
  function tabelaFrete(){
    const rows=CONFIG.frete[state.produto]; const f2=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    let t='<table><thead><tr><th rowspan="2">UF</th>'+FAIXAS.map(f=>`<th colspan="2">${f} g</th>`).join('')+'</tr><tr>'+FAIXAS.map(()=>'<th>Cap.</th><th>Int.</th>').join('')+'</tr></thead><tbody>';
    rows.forEach(r=>{ t+=`<tr><th>${r[1]}</th>`+r.slice(2).map(p=>`<td>${f2(p[0])}</td><td>${f2(p[1])}</td>`).join('')+'</tr>'; });
    return t+'</tbody></table>';
  }
  function wireExtras(){
    const c=$('freteInt'); if(!c) return;
    c.onchange=e=>{ state.freteInt=e.target.checked; state.modo=state.modo; renderCatalog(); renderCart(); };
    const p=$('freteProd'); if(p) p.onchange=e=>{ state.produto=e.target.value; $('produto').value=state.produto; render(); };
  }
  function renderCatalog(){
    let h='';
    Object.keys(GRUPOS).forEach(g=>{
      h+=`<section class="group"><h2>${GRUPOS[g].t}</h2><p>${GRUPOS[g].d}</p>`;
      CONFIG.servicos.filter(s=>s.grupo===g).forEach(s=>{
        const it=state.items[s.id];
        h+=`<div class="svc ${it.on?'on':''}" data-id="${s.id}">
          <div><h3>${s.nome}${s.tipo==='unico'?'<span class="tag">Uma vez</span>':''}</h3><div class="d">${s.desc}</div></div>
          <div class="price"><b data-pr="${s.id}">${precoTxt(s)}</b><small>${s.unidade}${s.min?` · mín. ${brl(s.min)}/mês`:''}</small></div>
          <div class="ctl">`;
        h+=`<label class="f">${s.qtdRot}<input type="number" min="0" step="${s.tipo==='perc'?100:1}" inputmode="decimal" data-k="qtd" value="${it.qtd}"></label>
          <button class="add" data-k="toggle">${it.on?'No orçamento ✓':'Adicionar'}</button></div></div>`;
      });
      if(g==='env') h+=extrasEnv();
      h+='</section>';
    });
    $('catalog').innerHTML=h;
    wireExtras();
    $('catalog').querySelectorAll('.svc[data-id]').forEach(card=>{
      const s=byId(card.dataset.id), it=state.items[s.id];
      card.querySelector('[data-k=toggle]').onclick=()=>{ it.on=!it.on; if(it.on && !(Number(it.qtd)>0)) it.qtd=ORIGINAL.servicos.find(o=>o.id===s.id).qtd||1; state.modo=null; render(); };
      card.querySelector('[data-k=qtd]').oninput=e=>{ it.qtd=e.target.value; if(Number(it.qtd)>0 && !it.on){it.on=true; card.classList.add('on'); card.querySelector('.add').textContent='No orçamento ✓'; state.modo=null; renderModes();} renderCart(); };
      card.querySelectorAll('select').forEach(sel=>sel.onchange=e=>{ s[e.target.dataset.k]=e.target.value; card.querySelector('[data-pr]').textContent=precoTxt(s); renderCart(); });
    });
  }

  function lines(){ return CONFIG.servicos.filter(s=>state.items[s.id].on && Number(state.items[s.id].qtd)>0); }
  function renderCart(){
    const L=lines(); const prod = state.produto==='livros'?'Livros':'Outros produtos';
    $('cartSub').textContent = ($('cliente').value? $('cliente').value+' · ':'')+prod+' · proposta válida por '+CONFIG.validadeDias+' dias';
    const groups=[['mensal','Mensalidade fixa'],['volume','Por volume (estimativa do mês)'],['perc','Por resultado (estimativa do mês)'],['unico','Implantação (única)']];
    let h='', mensal=0, unico=0, pedidos=0;
    groups.forEach(([t,tt])=>{ const A=L.filter(s=>s.tipo===t); if(!A.length) return;
      h+=`<div class="sec">${tt}</div>`;
      A.forEach(s=>{ const v=sub(s); const q=Number(state.items[s.id].qtd);
        if(t==='unico') unico+=v; else mensal+=v;
        if(s.id==='manuseio') pedidos+=q;
        h+=`<div class="line"><span>${s.nome}</span><b>${brl(v)}</b><em>${s.tipo==='perc'?brl(q)+' × '+pct(s.preco):q.toLocaleString('pt-BR')+' × '+precoTxt(s)}</em><button class="rm" data-rm="${s.id}">remover</button></div>`; });
    });
    if(state.items.manuseio.on && Number(state.items.manuseio.qtd)>0){
      h+='<div class="sec">Incluso, sem custo</div>'+CONFIG.inclusos.map(x=>`<div class="line"><span>${x.nome}</span><b>R$ 0,00</b></div>`).join('')+'<div class="line"><span style="color:var(--muted);font-size:12px">Pedidos de até 3 itens: 1 produto e 2 brindes.</span></div>';
    }
    if(state.freteInt) h+=`<div class="sec">Interesse registrado</div><div class="line"><span>Tabela de frete Bookbox Logística (${prodNome()})</span><b>Tabela</b></div>`;
    if(!L.length && !state.freteInt) h='<div class="empty">Escolha uma modalidade acima ou adicione serviços ao orçamento.</div>';
    $('cartBody').innerHTML=h;
    $('cartBody').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{state.items[b.dataset.rm].on=false; state.modo=null; render();});
    $('totMensal').textContent=brl(mensal); $('barTot').textContent=brl(mensal); $('totUnico').textContent=brl(unico);
    $('totPedido').textContent = pedidos>0? brl(mensal/pedidos):'—';
    return {mensal,unico,pedidos,L};
  }

  function resumo(){ const r=renderCart(); const prod=state.produto==='livros'?'Livros':'Outros produtos';
    let t=`ORÇAMENTO BOOKBOX LOGÍSTICA\n${$('cliente').value?'Cliente: '+$('cliente').value+'\n':''}Produtos: ${prod}\nValidade: ${CONFIG.validadeDias} dias\n\n`;
    r.L.forEach(s=>{ const q=Number(state.items[s.id].qtd); t+=`- ${s.nome}: ${s.tipo==='perc'?brl(q)+' x '+pct(s.preco):q+' x '+precoTxt(s)} = ${brl(sub(s))}${s.tipo==='unico'?' (uma vez)':''}\n`; });
    if(state.items.manuseio.on) t+=`\nIncluso sem custo: item adicional, brinde ou encarte (pedidos de até 3 itens: 1 produto e 2 brindes) e tratamento de devolução.\n`;
    if(state.freteInt) t+=`\nInteresse na tabela de frete Bookbox Logística (${prodNome()}): sim.\n`;
    t+=`\nEstimativa mensal: ${brl(r.mensal)}\nImplantação (única): ${brl(r.unico)}\n`; if(r.pedidos>0) t+=`Custo médio por pedido: ${brl(r.mensal/r.pedidos)}\n`;
    t+='\n'+CONFIG.termos.map(x=>'* '+x).join('\n'); return t; }

  async function copyText(text, box){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){ box.hidden=false; box.value=text; box.focus(); box.select(); return false; } }

  function renderAdmin(){
    $('admRows').innerHTML = CONFIG.servicos.map(s=>{
      const price = s.porProduto
        ? `<input type="number" step="0.01" data-a="pp-livros" data-id="${s.id}" value="${s.porProduto.livros}" title="Livros"><span style="font-size:11px;color:var(--muted)">Outros ↓</span>`
        : `<input type="number" step="${s.tipo==='perc'?0.001:0.01}" data-a="preco" data-id="${s.id}" value="${s.preco}">`;
      return `<div class="row"><span>${s.nome}<br><span style="color:var(--muted);font-size:11.5px">${s.unidade}${s.tipo==='perc'?' (0,04 = 4%)':''}${s.porProduto?' · Livros / Outros':''}</span></span>
        <span>${price}${s.porProduto?`<br><input type="number" step="0.01" data-a="pp-outros" data-id="${s.id}" value="${s.porProduto.outros}" title="Outros produtos">`:''}</span>
        <span>${s.tipo==='mensal'||s.tipo==='unico'?'<span style="color:var(--muted);font-size:12px">n/a</span>':`<input type="number" step="1" data-a="min" data-id="${s.id}" value="${s.min||0}">`}</span></div>`; }).join('');
    $('admRows').querySelectorAll('input').forEach(i=>i.oninput=()=>{ const s=byId(i.dataset.id), v=parseFloat(i.value)||0, a=i.dataset.a;
      if(a==='preco') s.preco=v; else if(a==='min') s.min=v; else if(a==='pp-livros') s.porProduto.livros=v; else if(a==='pp-outros') s.porProduto.outros=v;
      persist(); renderCatalog(); renderCart(); });
    $('admExample').checked=CONFIG.valoresDeExemplo;
  }

  function render(){ renderModes(); renderCatalog(); renderCart(); }

  $('cliente').oninput=renderCart;
  $('produto').onchange=e=>{state.produto=e.target.value; render();};
  $('clear').onclick=()=>{ state.freteInt=false; CONFIG.servicos.forEach(s=>state.items[s.id].on=false); state.modo=null; $('copybox').hidden=true; render(); };
  $('copy').onclick=async()=>{ const ok=await copyText(resumo(), $('copybox')); $('copy').textContent= ok?'Resumo copiado ✓':'Copie o texto abaixo'; setTimeout(()=>$('copy').textContent='Copiar resumo',2200); };
  $('termos').innerHTML = CONFIG.termos.map(t=>`<li>${t}</li>`).join('');


  $('banner').hidden=!CONFIG.valoresDeExemplo;
  applyModo('A');
})();
</script>

</body>
</html>
